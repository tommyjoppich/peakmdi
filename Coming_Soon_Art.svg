<?xml version="1.0" encoding="UTF-8"?>
<svg id="Layer_1" xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 260 100" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .accent-line {
        stroke: #f2c300;
        stroke-width: 1.25;
        stroke-linecap: butt;
      }
      .cs-text {
        fill: #ffffff;
        font-family: 'Montserrat', Arial, Helvetica, sans-serif;
      }
    </style>
  </defs>

  <!-- Small gold accent line above the copy: thin, long, squared-off ends -->
  <line class="accent-line" x1="90" y1="14" x2="170" y2="14" />

  <!-- 2-line message, first line fully bolded -->
  <text x="130" y="42" text-anchor="middle" class="cs-text" font-size="19" font-weight="400">
    <tspan x="130" dy="0" font-weight="700">A new PEAK experience</tspan>
    <tspan x="130" dy="30" font-weight="400">is on the way.</tspan>
  </text>
</svg>
